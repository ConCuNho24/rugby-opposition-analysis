[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rugby-opposition-analysis"
version = "0.1.0"
description = "A source-independent Rugby Union opposition-analysis proof of concept."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.1",
  "matplotlib>=3.8,<3.12",
  "Jinja2>=3.1,<4",
  "streamlit>=1.39,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
